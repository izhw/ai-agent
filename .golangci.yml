version: "2"

run:
  timeout: 10m
  tests: true
  allow-parallel-runners: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - durationcheck
    - errname
    - errorlint
    - gosec
    - nilerr
    - nilnil
    - noctx
    - sqlclosecheck
    - unconvert
    - unparam
    - copyloopvar
    - errcheck
    - gocyclo
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
    - gocritic
    - gocognit
    - misspell
    - prealloc
    - whitespace
    - nolintlint
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocyclo:
      min-complexity: 30
    gocognit:
      min-complexity: 30
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gosec:
      excludes:
        - G115
    staticcheck:
      checks:
        - all
    unused:
      field-writes-are-uses: false
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: argument-limit
          arguments:
            - 6
        - name: function-length
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: line-length-limit
          arguments:
            - 120
        - name: cognitive-complexity
          arguments:
            - 30
        - name: max-public-structs
          disabled: true
        - name: function-result-limit
          arguments:
            - 4
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - ".gocache"
      - "vendor$"
      - "third_party$"
      - "testdata$"
    rules:
      - linters:
          - contextcheck
        path: agentkit/engine.go
        text: "Non-inherited new context"

formatters:
  enable:
    - gofmt
    - gci
    - gofumpt
    - goimports
    - golines
  settings:
    gofmt:
      simplify: true
    gci:
      sections:
        - standard
        - default
        - localmodule
  exclusions:
    generated: lax
    paths:
      - ".gocache"
      - "vendor$"
      - "third_party$"
      - "testdata$"
